[build]
  command = "npm install && npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# The link-in-bio page. /social.html is a poor thing to put in an Instagram bio, and both
# /connect and /links 404d. The page itself stays where it is; these are the public URLs.
[[redirects]]
  from = "/connect"
  to = "/social.html"
  status = 301

[[redirects]]
  from = "/links"
  to = "/social.html"
  status = 301

[[redirects]]
  from = "/work-with-me"
  to = "/services"
  status = 301

[[redirects]]
  from = "/book"
  to = "/services"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
